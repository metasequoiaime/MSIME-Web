name: Sync update manifest

# public/update.json is what the download page and the in-app "检查更新" both read, so a release that
# is not mirrored here is invisible to users. This job keeps the file in step with MSIME-Windows
# instead of relying on someone remembering to edit it by hand after every release.
#
# The highest published installer version wins, prereleases included. /releases/latest is deliberately not used:
# it skips prereleases, and every published release of this product is currently a prerelease, so it
# answers 404 here.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-manifest]

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror the newest published release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_REPOSITORY: metasequoiaime/MSIME-Windows
      MANIFEST: public/update.json
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate and generate the manifest
        id: write
        run: |
          set -euo pipefail
          node --test scripts/generate-update.test.mjs
          node scripts/generate-update.mjs
          if git diff --quiet -- "$MANIFEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the manifest
        if: steps.write.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m "chore(release): sync validated Windows release metadata"
          git push
