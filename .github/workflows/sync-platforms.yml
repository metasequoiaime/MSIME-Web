name: Sync platform downloads

# public/platforms.json 给下载页提供三个平台各自的最新版本与安装包。三个平台在各自的仓库发版，版本号互不相通，所以要逐个仓库取。
#
# 这个 PR 不自动合并。scripts/enable-manifest-automerge.py 只接受「改动恰好是 public/update.json」的差异，放宽那份白名单是在动自动化的安全边界，得由仓库维护者单独审一次，不该作为加一个数据文件的副作用。在那之前这个 PR 需要人工合并。
#
# public/update.json 不受影响：它是 Windows 客户端「检查更新」读的接口，由 update-manifest.yml 单独维护。

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-platforms
  cancel-in-progress: false

jobs:
  sync:
    name: Propose refreshed platform downloads
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MANIFEST: public/platforms.json
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate and regenerate
        id: write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node --test scripts/generate-platforms.test.mjs
          node scripts/generate-platforms.mjs
          if git diff --quiet -- "$MANIFEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the PR automation credential
        if: steps.write.outputs.changed == 'true'
        env:
          AUTOMATION_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: test -n "$AUTOMATION_TOKEN"

      - name: Create or update the downloads PR
        if: steps.write.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A trusted token triggers PR CI and deployment after merging.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          add-paths: public/platforms.json
          branch: automation/platform-downloads
          base: main
          delete-branch: true
          commit-message: 'chore(site): refresh platform download manifest'
          title: 'chore(site): refresh platform download manifest'
          body: 'Latest published release and packages for Windows, macOS and Linux. Merge by hand: this file is outside the release manifest auto-merge allowlist.'
