<!doctype html>
<html lang="zh-CN" class="preload">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/msime.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="水杉输入法文档" />
  <title>文档 | 水杉输入法</title>

  <script>
    (() => {
      try {
        const theme = localStorage.getItem("msime-theme");
        document.documentElement.dataset.theme = ["light", "dark", "system"].includes(theme) ? theme : "system";
      } catch {
        document.documentElement.dataset.theme = "system";
      }
    })();
  </script>

  <style>
    html { background-color: #202020; color-scheme: dark; }
    html[data-theme="light"] { background-color: #f3f5f7; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="system"] { background-color: #f3f5f7; color-scheme: light; }
    }

    body {
      background-color: inherit;
    }

    html.preload body {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="header-wrap">
    <header class="container header">
      <nav class="nav">
        <a class="logo" href="/">
          <img src="/msime-logo.png" width="40" height="40" decoding="async" alt="logo" />
          <h2>水杉输入法</h2>
        </a>

        <button class="btn-toggle" id="btn-toggle" type="button" aria-label="打开导航菜单">
          <img src="/img/icons/Menu.svg" alt="menu" class="nav-icon" />
        </button>
      </nav>
    </header>
  </div>

  <div class="nav-menu" id="nav-menu">
    <button class="btn-close" id="btn-close" type="button" aria-label="关闭导航菜单">
      <img src="/img/icons/Close_round.svg" alt="close" class="nav-icon" />
    </button>

    <ul class="nav-list">
      <li class="nav-item">
        <a href="/" class="nav-link">
          <img src="/img/icons/nav/home.svg" alt="" class="nav-link-icon" />首页</a>
      </li>
      <li class="nav-item">
        <a href="/docs/" class="nav-link" aria-current="page">
          <img src="/img/icons/nav/docs.svg" alt="" class="nav-link-icon" />文档</a>
      </li>
      <li class="nav-item">
        <a href="/price/" class="nav-link">
          <img src="/img/icons/nav/price.svg" alt="" class="nav-link-icon" />价格</a>
      </li>
      <li class="nav-item">
        <a href="/code/" class="nav-link">
          <img src="/img/icons/nav/code.svg" alt="" class="nav-link-icon" />开源代码</a>
      </li>
      <li class="nav-item">
        <a href="/download/" class="nav-link">
          <img src="/img/icons/nav/download.svg" alt="" class="nav-link-icon" />下载</a>
      </li>
      <li class="nav-item">
        <a href="/about/" class="nav-link">
          <img src="/img/icons/nav/about.svg" alt="" class="nav-link-icon" />关于</a>
      </li>
      <li class="nav-item theme-switcher" id="theme-switcher">
        <button class="theme-button" id="theme-button" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="theme-icon" aria-hidden="true">◐</span><span>主题</span>
        </button>
        <div class="theme-options" id="theme-options" role="menu" aria-label="主题模式">
          <button class="theme-option" type="button" role="menuitemradio" data-theme-choice="light">亮色</button>
          <button class="theme-option" type="button" role="menuitemradio" data-theme-choice="dark">暗色</button>
          <button class="theme-option" type="button" role="menuitemradio" data-theme-choice="system">跟随系统</button>
        </div>
      </li>
    </ul>
  </div>

  <main class="docs-page">
    <div class="container docs-shell">
      <aside class="docs-sidebar" aria-label="文档导航">
        <button class="docs-toc-toggle" id="docs-toc-toggle" type="button" aria-expanded="false">
          <span>文档目录</span>
          <span class="docs-toc-toggle-icon" aria-hidden="true">
            <svg viewBox="0 0 12 12" focusable="false">
              <path d="M2.25 4.25 6 8l3.75-3.75" />
            </svg>
          </span>
        </button>
        <p class="docs-kicker">文档目录</p>
        <nav class="docs-toc" id="docs-toc"></nav>
      </aside>

      <article class="docs-content" id="docs-content" aria-live="polite"></article>
    </div>
  </main>

  <footer>
    <span>Copyright © 2026-present</span>
    <a href="https://github.com/fanlusky" target="_blank" rel="noreferrer">fanlusky</a>
    <span>@<span class="lxl">乱序楼</span></span>
  </footer>

  <script type="module" src="/src/docs.ts"></script>
</body>

</html>
