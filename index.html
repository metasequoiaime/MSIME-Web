<!doctype html>
<html lang="en" class="preload">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/msime.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSIME | 水杉输入法</title>

  <script>
    (() => {
      try {
        const theme = localStorage.getItem("msime-theme");
        document.documentElement.dataset.theme = ["light", "dark", "system"].includes(theme) ? theme : "system";
      } catch {
        document.documentElement.dataset.theme = "system";
      }
    })();
  </script>

  <style>
    body {
      background-color: var(--bg);
    }

    html.preload body {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="header-wrap">
    <header class="container header">
      <nav class="nav">
        <a class="logo" href="/">
          <img src="/msime.svg" alt="logo" />
          <h2>水杉输入法</h2>
        </a>

        <button class="btn-toggle" id="btn-toggle">
          <img src="/img/icons/Menu.svg" alt="menu" class="nav-icon" />
        </button>
      </nav>
    </header>

    <div class="nav-menu" id="nav-menu">
      <button class="btn-close" id="btn-close">
        <img src="/img/icons/Close_round.svg" alt="close" class="nav-icon" />
      </button>

      <ul class="nav-list">
        <li class="nav-item">
          <a href="/docs/" class="nav-link">
            <img src="/img/icons/nav/docs.svg" alt="" class="nav-link-icon" />文档</a>
        </li>
        <li class="nav-item">
          <a href="/price/" class="nav-link">
            <img src="/img/icons/nav/price.svg" alt="" class="nav-link-icon" />价格</a>
        </li>
        <li class="nav-item">
          <a href="https://github.com/metasequoiaime/MetasequoiaImeTsf" class="nav-link">
            <img src="/img/icons/nav/code.svg" alt="" class="nav-link-icon" />开源代码</a>
        </li>
        <li class="nav-item">
          <a href="https://github.com/metasequoiaime/MetasequoiaImeTsf/releases" class="nav-link" target="_blank" rel="noreferrer">
            <img src="/img/icons/nav/download.svg" alt="" class="nav-link-icon" />下载</a>
        </li>
        <li class="nav-item">
          <a href="/about/" class="nav-link">
            <img src="/img/icons/nav/about.svg" alt="" class="nav-link-icon" />关于</a>
        </li>
        <li class="nav-item theme-switcher" id="theme-switcher">
          <button class="theme-button" id="theme-button" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="theme-icon" aria-hidden="true">◐</span><span>主题</span>
          </button>
          <div class="theme-options" id="theme-options" role="menu" aria-label="主题模式">
            <button class="theme-option" type="button" role="menuitemradio" data-theme-choice="light">亮色</button>
            <button class="theme-option" type="button" role="menuitemradio" data-theme-choice="dark">暗色</button>
            <button class="theme-option" type="button" role="menuitemradio" data-theme-choice="system">跟随系统</button>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <section class="wrapper">
    <div class="container">
      <div class="hero">
        <div class="hero-content">
          <h1 class="hero-title">
            改善 Windows 的中英文输入体验
          </h1>
          <p class="hero-desc">
            墨池飞出北溟鱼，笔锋杀尽中山兔。
          </p>

          <div class="hero-buttons">
            <a class="btn btn-download" href="https://github.com/metasequoiaime/MetasequoiaImeTsf/releases" target="_blank" rel="noreferrer">
              下载
              <img src="/img/icons/Download.svg" alt="download" class="btn-icon" />
            </a>

            <a class="btn btn-docs" href="/docs/">
              文档
            </a>
          </div>
        </div>

        <div class="hero-image">
          <div class="hero-screenshot">
            <video class="hero-media hero-media-dark" autoplay muted loop playsinline preload="metadata" aria-label="ime-img">
              <source src="/img/typing_words_padded.webm" type="video/webm" />
            </video>
            <img class="hero-media hero-media-light" src="/img/typing_words_light.gif" alt="输入法打字演示" />
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span>Copyright © 2026-present</span>
    <a href="https://github.com/fanlusky" target="_blank" rel="noreferrer">fanlusky</a>
    <span>@<span class="lxl">乱序楼</span></span>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
